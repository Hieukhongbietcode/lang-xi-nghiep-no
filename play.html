<style>
    :root { --bg:#0b1120; --card:#131c31; --line:#26324a; --txt:#e2e8f0; --mute:#8a96b0; --iris:#7E63F2; --iris2:#a5b4fc; --ok:#22c55e; --bad:#ef4444; --warn:#eab308; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family: Inter, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { padding: env(safe-area-inset-top, 0) 16px env(safe-area-inset-bottom, 0); display:flex; flex-direction:column; align-items:center;
        background: radial-gradient(120% 60% at 50% 0%, #1b2547 0%, var(--bg) 60%); }
    .wrap { width:100%; max-width:440px; flex:1; display:flex; flex-direction:column; padding:28px 0 24px; }
    .brand { display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:22px; }
    .brand img { width:64px; height:64px; filter: drop-shadow(0 6px 18px rgba(249,115,22,.35)); }
    .brand h1 { margin:0; font-size:22px; font-weight:900; letter-spacing:-.01em; }
    .brand p { margin:0; color:var(--mute); font-size:13px; font-weight:600; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; animation: pop .28s cubic-bezier(.2,.8,.2,1.1) both; }
    @keyframes pop { from { opacity:0; transform: translateY(8px) scale(.98) } to { opacity:1; transform:none } }
    label { display:block; font-size:12px; font-weight:800; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; margin:0 0 6px; }
    input { width:100%; font:inherit; font-size:17px; font-weight:700; color:var(--txt); background:#0b1222; border:1.5px solid var(--line); border-radius:14px; padding:13px 14px; outline:none; transition: border-color .2s; }
    input:focus { border-color: var(--iris); }
    #in-code { text-transform:uppercase; letter-spacing:.35em; text-align:center; font-size:22px; font-weight:900; }
    .field { margin-bottom:16px; }
    .btn { width:100%; font:inherit; font-size:16px; font-weight:800; border:none; border-radius:14px; padding:15px; cursor:pointer; transition: transform .1s, opacity .2s, background-color .2s; }
    .btn:active { transform: scale(.97); }
    .btn-main { background: var(--iris); color:#fff; box-shadow: 0 8px 24px rgba(126,99,242,.35); }
    .btn-main:disabled { opacity:.5; cursor:default; box-shadow:none; }
    .btn-ghost { background:transparent; color:var(--mute); border:1px solid var(--line); margin-top:12px; }
    .err { min-height:20px; margin:10px 0 0; color:#f87171; font-size:14px; font-weight:700; text-align:center; }
    .err.big { font-size:17px; }
    .room-head { text-align:center; margin-bottom:14px; }
    .room-head .lbl { color:var(--mute); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; }
    .room-head .code { font-size:38px; font-weight:900; letter-spacing:.25em; margin-top:2px; }
    .me { display:flex; align-items:center; justify-content:center; gap:8px; color:var(--iris2); font-weight:800; margin-bottom:14px; }
    .status { text-align:center; padding:12px; border-radius:14px; background:#0f1730; color:var(--iris2); font-weight:700; font-size:14px; margin-bottom:14px; }
    .status.locked { color:#fde68a; background:#2a2410; }
    .status .dots::after { content:''; animation: dots 1.4s steps(4,end) infinite; }
    @keyframes dots { 0% { content:'' } 25% { content:'.' } 50% { content:'..' } 75% { content:'...' } }
    .list-head { display:flex; justify-content:space-between; color:var(--mute); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; margin:4px 2px 8px; }
    .plist { display:flex; flex-direction:column; gap:6px; }
    .pl { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px; background:#0f1626; animation: pop .25s ease both; }
    .pl.mine { box-shadow: inset 3px 0 0 var(--iris); background:#151d36; }
    .av { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:#fff; flex-shrink:0; }
    .pl .nm { flex:1; font-weight:700; }
    .dot { width:9px; height:9px; border-radius:50%; background:#475569; transition: background-color .3s; }
    .dot.on { background:var(--ok); box-shadow:0 0 0 3px rgba(34,197,94,.18); }
    .gm-line { display:flex; align-items:center; gap:8px; justify-content:center; color:var(--mute); font-size:13px; font-weight:700; margin-top:14px; }
    #net { position:fixed; left:50%; top: calc(env(safe-area-inset-top, 0px) + 10px); transform: translateX(-50%) translateY(-140%); z-index:50;
        background:#1e293b; border:1px solid var(--line); color:var(--txt); font-size:13px; font-weight:700; padding:9px 14px; border-radius:999px;
        box-shadow:0 8px 24px rgba(0,0,0,.4); transition: transform .3s cubic-bezier(.2,.8,.2,1); white-space:nowrap; }
    #net.show { transform: translateX(-50%) translateY(0); }
    .end { text-align:center; padding:28px 20px; }
    .end .ic { font-size:44px; margin-bottom:8px; }
    .end h2 { margin:0 0 6px; font-size:20px; }
    .end p { margin:0 0 18px; color:var(--mute); font-weight:600; }
    /* ---- Lá bài (Giai đoạn 2) ---- */
    .cz { margin-bottom:14px; border-radius:16px; padding:16px; text-align:center; background:linear-gradient(160deg,#211a4a,#121a33); border:1px solid #3b3480; animation: pop .3s cubic-bezier(.2,.8,.2,1.1) both; }
    .cz h3 { margin:0 0 4px; font-size:17px; } .cz p { margin:0 0 12px; color:var(--mute); font-size:13px; font-weight:600; }
    .cz.done { background:#0f1f17; border-color:#1f5134; }
    .mini-card { width:64px; height:88px; margin:4px auto 12px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:900; color:#c4b5fd;
        background:linear-gradient(145deg,#312e81,#1e1b4b); border:2px solid #6d5dfc; animation: glow 2.4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { box-shadow:0 0 0 0 rgba(139,124,255,.55) } 50% { box-shadow:0 0 0 10px rgba(139,124,255,0) } }
    #card-ov { position:fixed; inset:0; z-index:40; background:rgba(2,6,16,.96); display:flex; align-items:center; justify-content:center; padding:20px; animation: fade .22s ease-out; }
    @keyframes fade { from { opacity:0 } to { opacity:1 } }
    .dl-wrap { position:relative; width:min(360px, 90vw); display:flex; flex-direction:column; align-items:center; }
    .dl-scene { perspective:1200px; width:100%; position:relative; }
    .dl-flipper { position:relative; transform-style:preserve-3d; transform: rotateY(180deg); }
    .dl-flipper.open { animation: dlOpen .7s cubic-bezier(.3,.7,.2,1) forwards; }
    .dl-flipper.closing { animation: dlClose .5s cubic-bezier(.5,0,.6,1) forwards; }
    @keyframes dlOpen { 0% { transform: rotateY(180deg) scale(.92) } 70% { transform: rotateY(-8deg) scale(1.02) } 100% { transform: rotateY(0) scale(1) } }
    @keyframes dlClose { 0% { transform: rotateY(0) } 100% { transform: rotateY(180deg) scale(.9) } }
    .dl-front, .dl-back { backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:24px; }
    .dl-front { min-height:380px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 22px; background:#1e293b; border:2px solid #334155; text-align:center; }
    .dl-back { position:absolute; inset:0; transform: rotateY(180deg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
        background: radial-gradient(120% 90% at 50% 0%, #1e2a4a, #0d1424 70%); border:2px solid #334155; }
    .dl-back-name { font-size:28px; font-weight:900; }
    .dl-back-card { width:100px; height:138px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:56px; font-weight:900; color:#c4b5fd; cursor:pointer;
        background:linear-gradient(145deg,#312e81,#1e1b4b); border:2px solid #6d5dfc; animation: glow 2.4s ease-in-out infinite; }
    .dl-back-hint { color:var(--iris2); font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
    .role-ic { width:96px; height:96px; object-fit:contain; filter: grayscale(1) brightness(.95); margin-bottom:14px; }
    .role-fac { display:inline-block; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; padding:3px 10px; border-radius:8px; background:#374151; color:#d1d5db; margin-bottom:10px; }
    .role-nm { font-size:30px; font-weight:900; margin-bottom:10px; }
    .role-desc { font-size:14px; line-height:1.55; color:#aab4c8; }
    .dl-x { position:absolute; top:12px; right:12px; z-index:5; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900;
        color:#ef4444; background:rgba(239,68,68,.16); border:1px solid rgba(239,68,68,.45); cursor:pointer; }
    .dl-confirm { margin-top:18px; opacity:0; transform:translateY(8px); pointer-events:none; transition: opacity .3s ease .45s, transform .3s ease .45s; }
    .dl-wrap.is-open .dl-confirm { opacity:1; transform:none; pointer-events:auto; }
    /* ---- Chat (Giai đoạn 3) ---- */
    .chat { margin-top:14px; border-top:1px solid var(--line); padding-top:12px; }
    .ch-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .ch-head b { font-size:13px; font-weight:800; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; }
    #ch-label { font-size:12px; font-weight:800; color:#fde68a; background:#2a2410; padding:4px 10px; border-radius:999px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:70%; }
    .ch-dead { font-size:12px; font-weight:700; color:#d4d4d8; background:#27272a; border-radius:10px; padding:8px 10px; margin-bottom:8px; }
    .ch-feed { height:min(46vh, 420px); min-height:200px; overflow-y:auto; background:#0b1222; border:1px solid var(--line); border-radius:14px; padding:8px 10px; display:flex; flex-direction:column; gap:3px; }
    .cm { font-size:14px; line-height:1.42; word-wrap:break-word; padding:2px 4px; border-radius:6px; animation: pop .2s ease both; }
    .cm.mine { background:rgba(126,99,242,.12); } .cm.gm { background:rgba(251,191,36,.08); }
    .cm .tag { font-size:11px; font-weight:800; padding:1px 6px; border-radius:6px; margin-right:5px; vertical-align:1px; }
    .tag.wolves { background:#450a0a; color:#fca5a5; } .tag.dead { background:#27272a; color:#d4d4d8; } .tag.couple { background:#500724; color:#f9a8d4; } .tag.dm { background:#2e1065; color:#c4b5fd; }
    .ch-empty { color:#475569; text-align:center; margin:auto; font-size:13px; font-weight:600; }
    .ch-chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .ch-chip { font:inherit; font-size:12px; font-weight:800; color:var(--mute); background:#111827; border:1px solid var(--line); border-radius:999px; padding:5px 10px; cursor:pointer; }
    .ch-chip.on { color:#fff; background:#3b2f8f; border-color:var(--iris); }
    .ch-row { display:flex; gap:8px; margin-top:8px; }
    #ch-in { flex:1; font-size:15px; padding:11px 12px; }
    #ch-in:disabled { opacity:.55; }
    #ch-send { width:48px; border:none; border-radius:14px; background:var(--iris); color:#fff; font-size:18px; cursor:pointer; }
    #ch-send:disabled { opacity:.35; }
    .ch-err { min-height:16px; font-size:12px; font-weight:700; color:#f87171; margin-top:4px; }
    #turn-toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 14px); transform:translateX(-50%) translateY(-12px); opacity:0; visibility:hidden; pointer-events:none; z-index:45; max-width:92vw;
        background:#3b2f8f; color:#fff; font-weight:800; font-size:14px; padding:12px 16px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.5); transition: transform .35s cubic-bezier(.2,.8,.2,1); text-align:center; }
    #turn-toast { transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .25s, visibility 0s linear .35s !important; }
    #turn-toast.show { transform:translateX(-50%) translateY(0); opacity:1; visibility:visible; transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .25s !important; }
    details.roster summary { cursor:pointer; list-style:none; } details.roster summary::-webkit-details-marker { display:none; }
    details.roster summary .list-head span:first-child::after { content:' ▾'; } details.roster:not([open]) summary .list-head span:first-child::after { content:' ▸'; }
    /* ---- Đang chơi: Vai + Vòng làng + Chat ---- */
    body.ingame .brand, body.ingame .room-head, body.ingame .me, body.ingame #lb-status, body.ingame #card-zone, body.ingame #lb-roster, body.ingame .gm-line { display:none !important; }
    body.ingame .wrap { padding-top:14px; }
    body.ingame .card { padding:14px; }
    body.ingame .chat { margin-top:12px; }
    .rb { display:none; } body.ingame .rb { display:block; }
    .rb-top { display:flex; align-items:center; gap:12px; }
    .rb-ic { width:44px; height:44px; border-radius:12px; background:#0b1222; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; overflow:hidden; }
    .rb-ic img { width:34px; height:34px; object-fit:contain; filter: grayscale(1) brightness(.95); }
    .rb-k { font-size:11px; font-weight:800; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; }
    .rb-n { font-size:18px; font-weight:900; } .rb-n.hid { letter-spacing:.2em; color:#475569; }
    .rb-btn { margin-left:auto; font:inherit; font-size:13px; font-weight:800; color:#e2e8f0; background:#1e293b; border:1px solid var(--line); border-radius:12px; padding:9px 12px; cursor:pointer; white-space:nowrap; }
    .rb-more { margin-top:10px; font-size:13px; line-height:1.5; color:#aab4c8; }
    .rb-pack { margin-top:8px; padding:8px 10px; border-radius:10px; background:#2a0f12; border:1px solid #7f1d1d; color:#fecaca; font-size:13px; font-weight:700; }
    .rg { display:none; } body.ingame .rg { display:block; margin-top:12px; }
    .rg-head { display:flex; justify-content:space-between; font-size:12px; font-weight:800; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
    .ring { position:relative; width:100%; aspect-ratio:1/1; max-height:min(52vh, 380px); margin:0 auto; }
    .ring::before { content:''; position:absolute; inset:16%; border-radius:50%; border:1px dashed #26324a; }
    .seat { position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:2px; width:62px; transition: opacity .4s, filter .4s; }
    .seat .av { width:var(--sz,38px); height:var(--sz,38px); font-size:calc(var(--sz,38px) * .36); box-shadow:0 0 0 2px #0b1120; }
    .seat .sn { font-size:11px; font-weight:700; color:#cbd5e1; max-width:62px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .seat.me .av { box-shadow:0 0 0 3px var(--iris); }
    .seat.dead { opacity:.5; filter:grayscale(1); }
    .seat .skull { position:absolute; top:-6px; right:6px; font-size:15px; filter:none; }
    .ring-mid { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; color:var(--mute); font-size:12px; font-weight:700; }
    .ring-mid b { display:block; font-size:26px; color:#e2e8f0; }
    /* ---- Chat bản 2 ---- */
    .g-status { display:none; } body.ingame .g-status { display:block; margin-bottom:10px; padding:10px 12px; border-radius:12px; background:#151f3d; border:1px solid #2c3a66; color:#dbe4ff; font-size:14px; font-weight:800; line-height:1.4; text-align:center; animation: pop .25s ease both; }
    .g-timer { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding:8px 14px; border-radius:12px; background:#0f1f17; border:1px solid #1f5134; color:#86efac; font-weight:800; font-size:13px; transition: background-color .3s, color .3s; }
    .g-timer b { font-size:26px; font-variant-numeric: tabular-nums; letter-spacing:.04em; }
    .g-timer.low { background:#2a0f12; border-color:#7f1d1d; color:#fca5a5; animation: pulse 1s ease-in-out infinite; } .g-timer.paused { opacity:.7; }
    @keyframes pulse { 50% { transform: scale(1.02) } }
    .ch-pin { margin-bottom:8px; padding:8px 10px; border-radius:10px; background:#2a2410; border:1px solid #574a16; color:#fde68a; font-size:13px; font-weight:800; }
    .ch-deck { margin-bottom:8px; border-radius:10px; background:#0f1626; border:1px solid var(--line); padding:7px 10px; }
    .ch-deck summary { cursor:pointer; font-size:12px; font-weight:800; color:var(--mute); text-transform:uppercase; letter-spacing:.05em; list-style:none; } .ch-deck summary::-webkit-details-marker { display:none; }
    .ch-deck summary::after { content:' ▸'; } .ch-deck[open] summary::after { content:' ▾'; } #ch-deck-n { color:#cbd5e1; }
    .dk-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; } .dk { font-size:12px; font-weight:800; padding:3px 8px; border-radius:8px; background:#1e293b; }
    .ch-tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none; }
    .ch-tab { position:relative; flex-shrink:0; font:inherit; font-size:12px; font-weight:800; color:var(--mute); background:#111827; border:1px solid var(--line); border-radius:999px; padding:6px 10px; cursor:pointer; }
    .ch-tab.on { color:#fff; background:#3b2f8f; border-color:var(--iris); } .ch-tab.live:not(.on) { border-color:#4ade80; color:#bbf7d0; }
    .ub { position:absolute; top:-6px; right:-4px; min-width:18px; height:18px; padding:0 5px; border-radius:99px; background:#ef4444; color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; }
    .cm.sys { font-weight:900; font-size:16px; line-height:1.35; padding:8px 10px; margin:4px 0; border-left:4px solid; background:rgba(255,255,255,.04); border-radius:8px; }
    .cm.pub { cursor:pointer; } .cm.ment { background:rgba(250,204,21,.14); box-shadow: inset 3px 0 0 #facc15; }
    .at { color:#93c5fd; font-weight:800; }
    .rr { display:flex; flex-wrap:wrap; gap:4px; margin-top:3px; } .rc { font:inherit; font-size:12px; background:#1e293b; border:1px solid var(--line); border-radius:99px; padding:1px 7px; color:#e2e8f0; cursor:pointer; }
    .rc.mine { border-color:var(--iris); background:#2a2163; }
    .rp { display:flex; gap:4px; margin-top:5px; padding:4px; border-radius:12px; background:#111827; border:1px solid var(--line); width:max-content; animation: pop .15s ease both; }
    .rpe { font-size:20px; background:none; border:none; cursor:pointer; padding:2px 4px; border-radius:8px; } .rpe:active { transform:scale(1.25); }
    .ch-typing { min-height:16px; font-size:12px; color:#a5b4fc; font-style:italic; margin-top:4px; }
    .ch-mention { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; } .mn { font:inherit; display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:#e2e8f0; background:#1e293b; border:1px solid var(--line); border-radius:99px; padding:3px 10px 3px 3px; cursor:pointer; }
    .mn .av { width:22px; height:22px; font-size:9px; }
    .ch-emo-pop { display:grid; grid-template-columns:repeat(9, 1fr); gap:2px; margin-top:6px; padding:6px; border-radius:12px; background:#111827; border:1px solid var(--line); max-height:150px; overflow-y:auto; }
    .ep { font-size:21px; background:none; border:none; cursor:pointer; padding:3px; border-radius:6px; } .ep:active { background:#1e293b; }
    .ch-emo { width:44px; border:1px solid var(--line); border-radius:14px; background:#111827; font-size:20px; cursor:pointer; } .ch-emo:disabled { opacity:.35; }
    .ch-slow { font-size:11px; font-weight:700; color:#93c5fd; margin-top:4px; min-height:0; }
    .ring-hint { font-size:13px; font-weight:800; color:#fde68a; text-align:center; margin-bottom:4px; }
    .ring.pickable .seat:not(.dead) { cursor:pointer; } .ring.pickable .seat:not(.dead) .av { animation: seatGlow 1.6s ease-in-out infinite; }
    @keyframes seatGlow { 50% { box-shadow:0 0 0 3px rgba(250,204,21,.5) } }
    .seat.voted .av { box-shadow:0 0 0 3px #ef4444 !important; animation:none !important; } .seat.voted::after { content:'🗳️'; position:absolute; bottom:12px; left:2px; font-size:14px; }
    #pick-ov { position:fixed; inset:0; z-index:50; background:rgba(2,6,16,.8); display:flex; align-items:flex-end; justify-content:center; padding:16px; animation: fade .2s ease-out; }
    .pk-card { width:min(380px, 100%); background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; text-align:center; animation: pop .25s cubic-bezier(.2,.8,.2,1.1) both; }
    .pk-card .av { width:56px; height:56px; font-size:20px; margin:0 auto 10px; } .pk-q { font-size:18px; font-weight:800; } .pk-sub { color:var(--mute); font-size:13px; margin:4px 0 14px; }
    .pk-row { display:flex; gap:10px; } .pk-row .btn { margin:0; }
    .hidden { display:none !important; }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>

<script>

const COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#0ea5e9','#6366f1','#a855f7','#ec4899','#84cc16'];

let netTimer = null;

// ---------------- Kết nối ----------------
let ws = null, me = load(), pending = null, retry = 0, retryTimer = null, wakeTimer = null, roster = null, ended = false;
function connect() {

    if (!/^wss?:\/\//.test(SERVER) || SERVER.includes('DOI-THANH')) { showEnd('⚙️', 'Chưa cài địa chỉ server', 'Quản trò cần điền địa chỉ server trong file play.html (WS_SERVER).', false); return; }
    clearTimeout(wakeTimer);
    wakeTimer = setTimeout(() => netMsg('⏳ Đang đánh thức server, có thể mất khoảng 1 phút…'), 3500);

        clearTimeout(wakeTimer); retry = 0; netMsg('');

}

}
function sendJ(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

// ---------------- Tin nhắn từ server ----------------
let resumeMiss = 0;
function onMsg(m) {
    if (m.t === 'joined') {

        pending = null; resumeMiss = 0;

        history.replaceState(null, '', location.pathname + '?room=' + m.code + (qs.get('ws') ? '&ws=' + encodeURIComponent(qs.get('ws')) : '') + (qs.get('tab') ? '&tab=1' : ''));
        renderLobby(); show('scr-lobby');
    } else if (m.t === 'react') { onReact(m);
    } else if (m.t === 'typing') { onTyping(m);
    } else if (m.t === 'chat') { chatAdd([m.m], false);

// ---------------- Lá bài (Giai đoạn 2) ----------------

const viewedKey = id => 'lxn_viewed_' + id;
const isViewed = id => { try { return IDS.getItem(viewedKey(id)) === '1'; } catch (e) { return false; } };
const setViewed = id => { try { IDS.setItem(viewedKey(id), '1'); } catch (e) {} };

    if (d.kind === 'card') {

}
function renderCardZone() {

    z.innerHTML = seen
        ? `<h3>✅ Bạn đã xem vai</h3><p>${phase === 'started' ? 'Ván đã bắt đầu. Bạn có thể xem lại vai bất cứ lúc nào.' : 'Chờ mọi người xem xong, quản trò sẽ bắt đầu Đêm 1.'}</p>

        : `<h3>🃏 Lá bài của bạn đã tới!</h3><p>Đảm bảo không ai nhìn màn hình của bạn rồi mở bài.</p>

}
function openCard() {

    ov.innerHTML = `<div class="dl-wrap" id="dl-wrap"><div class="dl-scene">

          <div class="dl-back"><div class="dl-back-name">${esc(me.name)}</div><div class="dl-back-card" id="dl-q">?</div><div class="dl-back-hint">Chạm vào lá bài để lật</div></div>

// Úp lá lại (nếu đã lật) rồi mờ dần 0.6s
function closeCard(instant) {

// ---------------- Chat (Giai đoạn 3 — bản 2) ----------------
const CH = { public: { ic: '💬', name: 'Làng' }, dm: { ic: '✉️', name: 'Quản trò' }, wolves: { ic: '🐺', name: 'Sói' }, couple: { ic: '💞', name: 'Cặp Đôi' }, dead: { ic: '👻', name: 'Người chết' }, muted: { ic: '🤐', name: 'Bị cấm nói' } };
const TAB_ORDER = ['public', 'dm', 'wolves', 'couple', 'dead', 'muted'];
const EMO_REACT = ['👍', '❤️', '👎', '🤔', '😂', '😭', '😠'];
const EMO_PICK = '😀😂🤣😅😊😍😎🤔🤨😐😏😒🙄😬😳🥺😭😡🤬😱🤫🤐😴🤯🥶👍👎👏🙏💪👀🫡❤️💔🔥💯✅❌❓❗🐺🧛👻💀🔪🛡️🔮🧪🌙☀️'.match(/\p{Extended_Pictographic}(\uFE0F)?/gu);
let chatList = [], chatSeen = new Set(), can = {}, label = '', slow = 0, tab = 'public', unread = {}, typing = {}, gstatus = null, timer = null, deck = null, pin = '', myVote = '', reactOpen = null, slowUntil = 0;
const chatKey = () => 'lxn_chat_' + (me ? me.code + '_' + me.id : '');
function chatLoad() { try { const d = JSON.parse(IDS.getItem(chatKey()) || '[]'); d.forEach(m => { if (!chatSeen.has(m.id)) { chatSeen.add(m.id); chatList.push(m); } }); } catch (e) {} }
function chatSave() { try { IDS.setItem(chatKey(), JSON.stringify(chatList.slice(-400))); } catch (e) {} }
const nameCol = name => { let h = 0; for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) >>> 0; return ['#f87171','#fb923c','#facc15','#4ade80','#2dd4bf','#38bdf8','#818cf8','#c084fc','#f472b6','#a3e635'][h % 10]; };
const mentionsMe = t => me && new RegExp('@' + me.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\p{L}\\p{N}])', 'iu').test(t);
// ---- Tiếng "Ting" (tự tạo, không cần file âm thanh) ----
let actx = null;
function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
document.addEventListener('pointerdown', unlockAudio, { passive: true });
function ting() {
    try {
        unlockAudio(); if (!actx) return;
        const t0 = actx.currentTime;
        [[1318.5, 0], [1760, 0.12]].forEach(([f, d]) => {
            const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = f;
            g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.35, t0 + d + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.45);
            o.connect(g).connect(actx.destination); o.start(t0 + d); o.stop(t0 + d + 0.5);
        });

    if (navigator.vibrate) { try { navigator.vibrate([60, 40, 90]); } catch (e) {} }
}
let titleT = null; const baseTitle = document.title;
function flashTitle(t) { clearInterval(titleT); let on = false; titleT = setInterval(() => { document.title = (on = !on) ? t : baseTitle; }, 900); }

['pointerdown', 'keydown', 'focus'].forEach(e => addEventListener(e, stopFlash, { passive: true }));
function turnToast(t) { const el = $('turn-toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove('show'), 4500); }
// ---- Nhận dữ liệu ----
function chatAdd(list, fromHist) {

    (list || []).forEach(m => {
        if (!m || chatSeen.has(m.id)) return; chatSeen.add(m.id); chatList.push(m); n++;
        if (!fromHist && me && m.from !== me.id) {
            if (m.ch !== tab) unread[m.ch] = (unread[m.ch] || 0) + 1;
            if (m.from !== 'gm' && mentionsMe(m.text)) { ping = true; turnToast('🔔 ' + m.name + ' nhắc tới bạn'); }
            if (m.from === 'gm' && m.ch === 'dm') ping = true;
        }
    });
    if (!n) return; if (ping) ting();
    chatList.sort((a, b) => a.ts - b.ts); chatSave(); renderChat();
}
function onReact(m) { const x = chatList.find(y => y.id === m.id); if (x) { x.r = m.r; chatSave(); renderChat(); } }

setInterval(() => renderTyping(), 800);
function onPerm(m) {
    can = m.can || {}; label = m.label || ''; slow = m.slow || 0;

    if (!can[tab]) { const w = ['wolves', 'couple', 'dm', 'public', 'muted', 'dead'].find(c => can[c]); if (w) tab = w; else if (!chatList.some(x => x.ch === tab)) tab = 'public'; }
    renderChat(); renderRingMode();
}
function onTurn(d) {

    if (!chatSeen.has(key)) { chatSeen.add(key); chatList.push({ id: key, ch: d.ch, sys: true, text: d.text, color: d.color, ts: Date.now() }); chatSave(); }
    if (fresh) { ting(); flashTitle('🔔 Tới lượt bạn'); turnToast('🔔 ' + d.text); tab = d.ch; unread[d.ch] = 0; }
    renderChat(); renderRingMode();
}
// ---- Vẽ khung chat ----
function tabsShown() { return TAB_ORDER.filter(c => c === 'public' || can[c] || chatList.some(m => m.ch === c)); }
function renderChat() {
    const box = $('chat'); if (!me) return;
    const show = !!(roster && roster.locked) || chatList.length > 0;
    box.classList.toggle('hidden', !show); if (!show) return;
    $('ch-label').textContent = label; $('ch-label').classList.toggle('hidden', !label);
    // ghim + danh sách vai
    $('ch-pin').classList.toggle('hidden', !pin); $('ch-pin').innerHTML = pin ? '📌 ' + esc(pin) : '';
    renderDeck();
    // tab
    const tabs = tabsShown(); if (!tabs.includes(tab)) tab = 'public';
    unread[tab] = 0;
    $('ch-tabs').innerHTML = tabs.map(c => `<button class="ch-tab${c === tab ? ' on' : ''}${can[c] ? ' live' : ''}" data-c="${c}">${CH[c].ic} ${CH[c].name}${unread[c] ? `<span class="ub">${unread[c]}</span>` : ''}</button>`).join('');
    $('ch-tabs').querySelectorAll('.ch-tab').forEach(b => b.onclick = () => { tab = b.dataset.c; reactOpen = null; renderChat(); });
    $('ch-dead').classList.toggle('hidden', !(can.dead && tab === 'dead'));
    // tin nhắn của tab
    const feed = $('ch-feed'), atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 70;
    const list = chatList.filter(m => m.ch === tab).slice(-300);
    feed.innerHTML = list.length ? list.map(m => {
        if (m.sys) return `<div class="cm sys" style="color:${m.color};border-color:${m.color}">🔔 ${esc(m.text)}</div>`;
        const gm = m.from === 'gm', mine = m.from === me.id, ment = !mine && mentionsMe(m.text);
        const txt = esc(m.text).replace(/@([\p{L}\p{N}_]+(?: [\p{L}\p{N}_]+)?)/gu, '<span class="at">@$1</span>');
        const r = m.r ? Object.entries(m.r).map(([e, u]) => `<button class="rc${u.includes(me.id) ? ' mine' : ''}" data-id="${m.id}" data-e="${e}">${e} ${u.length}</button>`).join('') : '';
        const picker = reactOpen === m.id ? `<div class="rp">${EMO_REACT.map(e => `<button class="rpe" data-id="${m.id}" data-e="${e}">${e}</button>`).join('')}</div>` : '';
        return `<div class="cm${mine ? ' mine' : ''}${gm ? ' gm' : ''}${ment ? ' ment' : ''}${m.ch === 'public' ? ' pub' : ''}" data-id="${m.id}"><b style="color:${gm ? '#fbbf24' : nameCol(m.name)}">${esc(gm ? 'Quản trò' : m.name)}</b>: ${txt}${r ? `<div class="rr">${r}</div>` : ''}${picker}</div>`;
    }).join('') : `<div class="ch-empty">${tab === 'dm' ? 'Tin nhắn riêng giữa bạn và quản trò sẽ hiện ở đây' : 'Chưa có tin nhắn'}</div>`;
    feed.querySelectorAll('.cm.pub').forEach(el => el.onclick = e => { if (e.target.closest('.rc,.rpe')) return; if (!can.public) return; reactOpen = reactOpen === el.dataset.id ? null : el.dataset.id; renderChat(); });
    feed.querySelectorAll('.rc,.rpe').forEach(b => b.onclick = e => { e.stopPropagation(); if (!can.public) { chErr('Chỉ thả biểu cảm được khi làng đang thảo luận'); return; } sendJ({ t: 'react', id: b.dataset.id, emo: b.dataset.e }); reactOpen = null; });
    if (atBottom || !feed._init) { feed.scrollTop = feed.scrollHeight; feed._init = true; }
    renderTyping();
    // ô nhập
    const inp = $('ch-in'), on = !!can[tab], cool = tab === 'public' && slowUntil > Date.now();
    inp.disabled = !on; $('ch-send').disabled = !on || cool; $('ch-emo').disabled = !on;
    inp.placeholder = !on ? (tab === 'public' ? (label.startsWith('🌙') ? '🌙 Ban đêm — chỉ chat khi tới lượt bạn' : can.muted ? '🤐 Bạn bị cấm nói hôm nay — nhắn ở tab Bị cấm nói' : '🔒 Chưa tới lượt bạn chat') : '🔒 Kênh này đang đóng')
        : { public: '💬 Nhắn với cả làng… (@ để nhắc tên)', dm: '✉️ Nhắn riêng quản trò…', wolves: '🐺 Nhắn với bầy Sói…', couple: '💞 Nhắn với người ấy…', dead: '👻 Nhắn với người chết…', muted: '🤐 Chỉ quản trò và người chết đọc được…' }[tab];
    $('ch-slow').textContent = slow && tab === 'public' && on ? `🐢 Chế độ chậm: mỗi người 1 tin / ${slow} giây` + (cool ? ` — chờ ${Math.ceil((slowUntil - Date.now()) / 1000)}s` : '') : '';
}
function renderTyping() {
    const el = $('ch-typing'); if (!el) return; const now = Date.now();
    const l = Object.values(typing).filter(t => t.until > now && t.ch === tab);
    el.textContent = l.length ? l.map(t => t.name).join(', ') + ' đang gõ…' : '';
}
function renderDeck() {
    const el = $('ch-deck'); if (!deck || !deck.length) { el.classList.add('hidden'); return; }
    el.classList.remove('hidden');
    const total = deck.reduce((a, r) => a + r.c, 0), col = { villager: '#86efac', wolf: '#fca5a5', independent: '#fde68a' };
    $('ch-deck-n').textContent = total + ' lá';
    $('ch-deck-list').innerHTML = deck.map(r => `<span class="dk" style="color:${col[r.f] || '#e2e8f0'}">${esc(r.n)}${r.c > 1 ? ' ×' + r.c : ''}</span>`).join('');
}
function chErr(t) { $('ch-err').textContent = t; clearTimeout(window._ceT); window._ceT = setTimeout(() => $('ch-err').textContent = '', 3500); }
// ---- Gửi ----
function chatSend() {
    const inp = $('ch-in'), text = inp.value.trim(); if (!text || !can[tab]) return;
    if (tab === 'public' && slowUntil > Date.now()) return;
    sendJ({ t: 'chat', ch: tab, text }); inp.value = ''; inp.focus(); hideMention(); hideEmo();
    if (tab === 'public' && slow) { slowUntil = Date.now() + slow * 1000; const iv = setInterval(() => { renderChat(); if (slowUntil <= Date.now()) clearInterval(iv); }, 500); }
}
$('ch-send').onclick = chatSend;
$('ch-in').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); chatSend(); } });
let lastTypingSent = 0;
$('ch-in').addEventListener('input', () => {
    if (['dm', 'wolves', 'couple', 'dead', 'muted'].includes(tab) && can[tab] && Date.now() - lastTypingSent > 2000) { lastTypingSent = Date.now(); sendJ({ t: 'typing', ch: tab }); }
    updateMention();
});
// ---- @ nhắc tên ----
function allNames() { return (village && village.length ? village.map(s => s.n) : (roster ? roster.players.map(p => p.name) : [])).filter(n => !me || n !== me.name); }
function updateMention() {
    const inp = $('ch-in'), pos = inp.selectionStart, before = inp.value.slice(0, pos), m = /@([\p{L}\p{N}_ ]{0,20})$/u.exec(before);
    if (!m || tab === 'dm') return hideMention();
    const q = m[1].toLowerCase(), list = allNames().filter(n => n.toLowerCase().startsWith(q)).slice(0, 8);
    if (!list.length) return hideMention();
    const box = $('ch-mention'); box.classList.remove('hidden');
    box.innerHTML = list.map(n => `<button class="mn" data-n="${esc(n)}">${avatar(n)}${esc(n)}</button>`).join('');
    box.querySelectorAll('.mn').forEach(b => b.onmousedown = b.ontouchstart = e => { e.preventDefault(); const v = inp.value; inp.value = v.slice(0, pos - m[0].length) + '@' + b.dataset.n + ' ' + v.slice(pos); inp.focus(); hideMention(); });
}
function hideMention() { $('ch-mention').classList.add('hidden'); }
// ---- Bảng emoji ----
function hideEmo() { $('ch-emo-pop').classList.add('hidden'); }
$('ch-emo').onclick = () => { const p = $('ch-emo-pop'); p.classList.toggle('hidden'); };
$('ch-emo-pop').innerHTML = EMO_PICK.map(e => `<button class="ep">${e}</button>`).join('');
$('ch-emo-pop').querySelectorAll('.ep').forEach(b => b.onmousedown = b.ontouchstart = e => {
    e.preventDefault(); const inp = $('ch-in'); if (inp.disabled) return;
    const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? s;
    inp.value = inp.value.slice(0, s) + b.textContent + inp.value.slice(en); const p = s + b.textContent.length; inp.setSelectionRange(p, p); inp.focus();
});
// ---- Chạm vòng làng: chọn mục tiêu (tới lượt) / bỏ phiếu (biểu quyết) ----
function myTurnCh() { return ['wolves', 'couple', 'dm'].find(c => can[c]) || null; }
function canVote() { return gstatus && gstatus.phase === 'vote' && me && (gstatus.voters || []).includes(me.name); }
function renderRingMode() {
    const hint = $('ring-hint'); if (!hint) return;
    const turn = myTurnCh();
    if (canVote()) hint.innerHTML = myVote ? `🗳️ Bạn đã bầu <b>${esc(myVote)}</b> — chạm lại để rút, chạm người khác để đổi` : '🗳️ Chạm vào một người để bỏ phiếu treo cổ';
    else if (turn) hint.innerHTML = turn === 'wolves' ? '👉 Chạm vào một người để đề xuất cắn' : turn === 'couple' ? '' : '👉 Chạm vào một người để gửi lựa chọn cho quản trò';
    else hint.innerHTML = '';
    hint.classList.toggle('hidden', !hint.innerHTML);
    $('ring').classList.toggle('pickable', !!(canVote() || (turn && turn !== 'couple')));
    document.querySelectorAll('#ring .seat').forEach(s => s.classList.toggle('voted', canVote() && s.dataset.n === myVote));
}
function onSeatTap(name) {
    if (canVote()) {
        if (name === me.name) { chErr('Không tự bầu cho mình'); return; }
        const t = myVote === name ? '' : name; myVote = t; sendJ({ t: 'to_gm', data: { kind: 'vote', target: t } }); renderRingMode(); return;
    }
    const turn = myTurnCh(); if (!turn || turn === 'couple') return;
    const roleName = card && card.role ? card.role.name : '';
    const text = turn === 'wolves' ? `👉 Đề xuất cắn: ${name}` : `👉 ${roleName || 'Tôi'} chọn: ${name}`;
    const ov = $('pick-ov'); ov.innerHTML = `<div class="pk-card">${avatar(name)}<div class="pk-q">${turn === 'wolves' ? 'Đề xuất cắn' : 'Chọn'} <b>${esc(name)}</b>?</div>
        <div class="pk-sub">Gửi ${turn === 'wolves' ? 'cho bầy Sói và quản trò' : 'riêng cho quản trò'}</div>
        <div class="pk-row"><button class="btn btn-ghost" id="pk-no">Huỷ</button><button class="btn btn-main" id="pk-yes">Gửi</button></div></div>`;
    ov.classList.remove('hidden');
    $('pk-no').onclick = () => ov.classList.add('hidden');
    $('pk-yes').onclick = () => { sendJ({ t: 'chat', ch: turn, text }); ov.classList.add('hidden'); tab = turn; renderChat(); };
}
// ---- Đồng hồ ----
function renderTimer() {
    const el = $('g-timer'); if (!el) return;
    if (!timer || timer.off) { el.classList.add('hidden'); return; }
    const left = timer.running ? Math.max(0, Math.ceil((timer.endAt - Date.now()) / 1000)) : timer.remain;
    el.classList.remove('hidden'); el.classList.toggle('low', left <= 10); el.classList.toggle('paused', !timer.running);
    el.innerHTML = `<span>${timer.type === 'defense' ? '🗣️ Biện minh' : '☀️ Thảo luận'}${timer.running ? '' : ' (tạm dừng)'}</span><b>${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}</b>`;
}
setInterval(renderTimer, 250);

// ---------------- Giao diện ----------------
function showJoin(msg) {
    show('scr-join');
    const e = $('join-err'); e.textContent = msg || ''; e.classList.remove('big');
    $('btn-join').disabled = false;
}
function showEnd(ic, title, sub, canRejoin, reopen) {
    ended = !canRejoin && !reopen ? true : ended;
    if (reopen) { ended = true; try { ws && ws.close(); } catch (e) {} }
    $('end-ic').textContent = ic; $('end-title').textContent = title; $('end-sub').textContent = sub;
    $('btn-end').textContent = reopen ? 'Dùng ở máy này' : 'Vào phòng khác';
    $('btn-end').classList.toggle('hidden', !canRejoin && !reopen);
    $('btn-end').onclick = () => { if (reopen) { ended = false; connect(); show('scr-wait'); $('wait-title').textContent = 'Đang kết nối'; $('wait-sub').textContent = ''; } else showJoin(''); };
    show('scr-end');
}
function renderLobby() {
    if (!me) return;
    $('lb-code').textContent = me.code; $('lb-me').textContent = me.name;
    const r = roster;
    const st = $('lb-status');
    if (!r) { st.innerHTML = '<span class="dots">Đang tải danh sách</span>'; return; }
    st.classList.toggle('locked', !!r.locked);
    st.innerHTML = phase === 'started' ? '🌙 Ván đã bắt đầu'
        : card ? '🃏 Quản trò đã chia bài'
        : r.locked ? (phase === 'waiting' && card === null && r.locked ? '🔒 Phòng đã khoá — chờ quản trò chia bài<span class="dots"></span>' : '🔒 Phòng đã khoá')
        : '<span class="dots">Đang chờ quản trò bắt đầu</span>';
    renderCardZone();
    if (phase === 'started' && !window._rosterFolded) { window._rosterFolded = true; $('lb-roster').open = false; }
    document.body.classList.toggle('ingame', phase === 'started' && !!card);
    renderRoleBar(); renderRing();
    $('g-status').textContent = gstatus ? gstatus.text : ''; $('g-status').classList.toggle('hidden', !gstatus);
    renderChat();
    $('lb-count').textContent = r.players.length + ' người';
    $('lb-list').innerHTML = r.players.map(p => `<div class="pl${p.id === me.id ? ' mine' : ''}">${avatar(p.name)}<span class="nm">${esc(p.name)}${p.id === me.id ? ' (bạn)' : ''}</span><span class="dot${p.online ? ' on' : ''}"></span></div>`).join('');
    $('lb-gmdot').classList.toggle('on', !!r.gmOnline);
    $('lb-gm').textContent = r.gmOnline ? 'Quản trò đang trực tuyến' : 'Quản trò đang mất kết nối';
    $('btn-leave').classList.toggle('hidden', !!r.locked);
}

// ---------------- Sự kiện ----------------
$('in-code').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5); });
function doJoin() {
    const name = $('in-name').value.replace(/\s+/g, ' ').trim(), code = $('in-code').value.trim();
    if (!name) { $('join-err').textContent = 'Hãy nhập tên hiển thị'; return; }
    if (code.length !== 5) { $('join-err').textContent = 'Mã phòng gồm 5 ký tự'; return; }
    $('join-err').textContent = ''; $('btn-join').disabled = true;
    pending = { t: 'join', code, name };
    if (ws && ws.readyState === 1) sendJ(pending); else connect();
}
$('btn-join').onclick = doJoin;
['in-name', 'in-code'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') doJoin(); }));
$('btn-leave').onclick = () => {
    if (!confirm('Rời phòng ' + me.code + '?')) return;
    sendJ({ t: 'leave' }); me = null; save(null); roster = null; card = null; phase = 'waiting'; chatList = []; chatSeen = new Set(); can = {}; pack = null; village = null; document.body.classList.remove('ingame'); showJoin('');
};
$('btn-wait-cancel').onclick = () => { me = null; save(null); showJoin(''); };

// ---------------- Khởi động ----------------
$('in-name').value = (() => { try { return localStorage.getItem('lxn_last_name') || ''; } catch (e) { return ''; } })();
const roomQ = (qs.get('room') || '').toUpperCase();
if (me && me.token && (!roomQ || roomQ === me.code)) {
    show('scr-wait'); $('wait-title').textContent = 'Đang vào lại phòng ' + me.code; $('wait-sub').textContent = '';
    connect();
} else {
    if (me && roomQ && roomQ !== me.code) { me = null; save(null); }
    $('in-code').value = roomQ.slice(0, 5);
    showJoin('');
    if (!$('in-name').value) $('in-name').focus(); else if (!$('in-code').value) $('in-code').focus();
    connect();
}
</script>
</body>
</html>
